# Maps the public A2A URLs to the connectors runtime inbound webhooks.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s;
  set $upstream http://connectors:8080;

  location = /.well-known/agent-card.json {
    proxy_pass $upstream/inbound/a2a-card;
    proxy_read_timeout 60s;
  }

  location = /a2a {
    proxy_pass $upstream/inbound/a2a;
    proxy_read_timeout 60s;
  }

  location = /a2a/ {
    proxy_pass $upstream/inbound/a2a;
    proxy_read_timeout 60s;
  }
}
