name: camunda-a2a

services:
  camunda:
    image: camunda/camunda:8.10.2
    environment:
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC -Xmx1536m
      - CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI=true
      - CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED=false
      - CAMUNDA_DATA_SECONDARYSTORAGE_TYPE=rdbms
      - CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL=jdbc:h2:file:/usr/local/camunda/data/h2db
      - CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME=sa
      - CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_PASSWORD=
      - CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_FLUSHINTERVAL=PT0.5S
    volumes:
      - camunda-data:/usr/local/camunda/data
    ports:
      - "${CAMUNDA_REST_PORT:-18080}:8080"
      - "${CAMUNDA_GRPC_PORT:-18500}:26500"
      - "${CAMUNDA_MGMT_PORT:-19600}:9600"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9600/actuator/health/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  connectors:
    image: camunda/connectors-bundle:8.10.0
    depends_on:
      camunda:
        condition: service_healthy
    environment:
      - JAVA_TOOL_OPTIONS=-Duser.timezone=UTC
      - CAMUNDA_CLIENT_MODE=self-managed
      - CAMUNDA_CLIENT_GRPC_ADDRESS=http://camunda:26500
      - CAMUNDA_CLIENT_REST_ADDRESS=http://camunda:8080
      - CAMUNDA_CLIENT_AUTH_METHOD=none
      - CAMUNDA_CLIENT_REQUEST_TIMEOUT=PT40S
      - SECRET_ENGINE_URL=http://camunda:8080
      - SECRET_A2A_PUBLIC_URL=${A2A_PUBLIC_URL:-http://localhost:18090}
      - SECRET_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - SECRET_OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-coder-30b-64k}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CONNECTORS_PORT:-18085}:8080"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - connectors
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-18090}:80"

volumes:
  camunda-data:
